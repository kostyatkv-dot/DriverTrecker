name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk WorkTime.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkTime-apk
          path: WorkTime.apk

      - name: Publish to release "apk-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Робочий час — остання збірка
          body: |
            Збірка №${{ github.run_number }} (${{ github.sha }}).
            Завантажте WorkTime.apk на телефон і відкрийте файл, щоб встановити.
          files: WorkTime.apk
          make_latest: true
